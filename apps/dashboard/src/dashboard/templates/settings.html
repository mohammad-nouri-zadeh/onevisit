{% extends "base.html" %}
{% block title %}Impostazioni{% endblock %}
{% block content %}
<h1>Impostazioni delle metriche</h1>
{% if request.query_params.get("salvato") %}<p class="box" role="status">Parametri salvati.</p>{% endif %}
<form method="post" action="/settings">
  <label for="k_threshold">Soglia k (casi minimi per mostrare un numero)</label>
  <input id="k_threshold" name="k_threshold" type="number" min="1" step="1" value="{{ config.get('k_threshold', 5)|int }}" required>
  <label for="cost_per_slot_eur">Costo per slot di sportello, in euro (usato nella stima)</label>
  <input id="cost_per_slot_eur" name="cost_per_slot_eur" type="number" min="0" step="0.01" value="{{ config.get('cost_per_slot_eur', 0) }}" required>
  <label for="window_weeks">Finestra prima e dopo, in settimane</label>
  <input id="window_weeks" name="window_weeks" type="number" min="1" step="1" value="{{ config.get('window_weeks', 4)|int }}" required>
  <p><button type="submit">Salva</button></p>
</form>
{% endblock %}
