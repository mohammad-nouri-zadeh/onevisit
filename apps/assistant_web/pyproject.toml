[project]
name = "assistant-web"
version = "0.1.0"
description = "Web chat del cittadino (FastAPI + Jinja2 + HTMX)."
requires-python = ">=3.13"
license = "EUPL-1.2"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "onevisit-ui",
    "itsdangerous>=2.2",
    "onevisit-agent",
    "onevisit-channels",
    "onevisit-db",
    "onevisit-knowledge",
    "onevisit-privacy",
]

[tool.uv.sources]
onevisit-ui = { workspace = true }
onevisit-agent = { workspace = true }
onevisit-channels = { workspace = true }
onevisit-db = { workspace = true }
onevisit-knowledge = { workspace = true }
onevisit-privacy = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant_web"]
