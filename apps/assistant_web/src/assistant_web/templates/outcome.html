{% extends "base.html" %}
{% block content %}
<div class="top">
  <h1>{{ t.outcome_title }}</h1>
</div>
<form method="post" action="/o/{{ token }}" class="form">
  <fieldset class="plain">
    <legend class="sr">{{ t.outcome_title }}</legend>
    <div class="choices outcome-choices">
      <button type="submit" name="outcome" value="ok" class="choice">{{ t.outcome_ok }}<span aria-hidden="true">›</span></button>
      <button type="submit" name="outcome" value="missing" class="choice">{{ t.outcome_missing }}<span aria-hidden="true">›</span></button>
      <button type="submit" name="outcome" value="other" class="choice">{{ t.outcome_other }}<span aria-hidden="true">›</span></button>
    </div>
  </fieldset>
  <div class="card">
  {% if items %}
  <label for="missing_id">{{ t.outcome_pick }}</label>
  <select id="missing_id" name="missing_id">
    <option value=""></option>
    {% for item in items %}<option value="{{ item.id }}">{{ item.official }}</option>{% endfor %}
  </select>
  {% endif %}
  <label for="missing_text">{{ t.outcome_text }}</label>
  <textarea id="missing_text" name="missing_text" rows="2"></textarea>
  <fieldset class="plain">
    <legend>{{ t.outcome_closed }}</legend>
    <div class="choices">
      <label class="choice"><input type="radio" name="closed_in_time" value="yes"> {{ t.yes }}</label>
      <label class="choice"><input type="radio" name="closed_in_time" value="no"> {{ t.no }}</label>
      <label class="choice"><input type="radio" name="closed_in_time" value="" checked> {{ t.dont_know }}</label>
    </div>
  </fieldset>
  <label for="rating">{{ t.outcome_rating }}</label>
  <select id="rating" name="rating">
    <option value=""></option>
    {% for n in range(1, 6) %}<option value="{{ n }}">{{ n }}</option>{% endfor %}
  </select>
  <label for="suggestion">{{ t.outcome_suggestion }}</label>
  <textarea id="suggestion" name="suggestion" rows="2"></textarea>
  </div>
</form>
{% endblock %}
