{% extends "base.html" %}
{% block content %}
<h1>{{ t.consents_title }}</h1>
<p>{{ t.consents_intro }}</p>
<form method="post" action="/consents/{{ token }}" class="card">
  <button type="submit" name="action" value="revoke">{{ t.consents_revoke }}</button>
  <button type="submit" name="action" value="delete" class="danger">{{ t.consents_delete }}</button>
</form>
{% endblock %}
