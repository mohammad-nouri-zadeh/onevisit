{% extends "base.html" %}
{% block content %}
<section class="callout disclosure" aria-label="AI">
  <p>{{ t.ai_disclosure }}</p>
</section>
<div id="messages" class="msgs" aria-live="polite" aria-relevant="additions">
  <div class="msg ai"><span class="who">{{ t.assistant }}</span><p>{{ t.welcome }}</p></div>
</div>
<form id="chat-form" class="composer" method="post" action="/chat"
      hx-post="/chat" hx-target="#messages" hx-swap="beforeend"
      hx-on::after-request="if(event.detail.successful){this.reset();document.getElementById('message').focus();}">
  <label for="message">{{ t.label_message }}</label>
  <div class="compose-row">
    <textarea id="message" name="message" rows="2" required
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.form.requestSubmit();}"></textarea>
    <button type="submit" class="btn">{{ t.send }}</button>
  </div>
</form>
<div id="contact-slot"></div>
{% endblock %}
