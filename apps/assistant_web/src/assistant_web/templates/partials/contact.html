<section id="contact" class="card" aria-labelledby="contact-title">
  <h2 id="contact-title">{{ t.contact_title }}</h2>
  {% if error_key %}<p class="error" role="alert">{{ t[error_key] }}</p>{% endif %}
  <form class="form" hx-post="/contact" hx-target="#contact" hx-swap="outerHTML" method="post" action="/contact">
    <fieldset class="plain">
      <legend>{{ t.contact_choice }}</legend>
      <div class="choices">
        <label class="choice"><input type="radio" name="choice" value="email" checked> {{ t.contact_email }}</label>
        <label class="choice"><input type="radio" name="choice" value="sms"> {{ t.contact_sms }}</label>
        <label class="choice"><input type="radio" name="choice" value="both"> {{ t.contact_both }}</label>
        <label class="choice"><input type="radio" name="choice" value="none"> {{ t.contact_none }}</label>
      </div>
    </fieldset>
    <div class="field-group">
      <label for="email">{{ t.label_email }}</label>
      <input id="email" name="email" type="email" autocomplete="email">
    </div>
    <div class="field-group">
      <label for="phone">{{ t.label_phone }}</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel">
    </div>
    <fieldset class="plain">
      <legend>{{ t.label_primary }}</legend>
      <div class="choices">
        <label class="choice"><input type="radio" name="primary" value="email" checked> {{ t.contact_email }}</label>
        <label class="choice"><input type="radio" name="primary" value="sms"> {{ t.contact_sms }}</label>
      </div>
    </fieldset>
    <fieldset class="plain">
      <legend>{{ t.consents_legend }}</legend>
      <div class="choices">
        <label class="choice"><input type="checkbox" name="consent_reminder" value="1"> {{ t.consent_reminder }}</label>
        <label class="choice"><input type="checkbox" name="consent_followup" value="1"> {{ t.consent_followup }}</label>
        <label class="choice"><input type="checkbox" name="consent_correction" value="1"> {{ t.consent_correction }}</label>
      </div>
    </fieldset>
    <details class="informativa"><summary>Privacy</summary><div class="notice">{{ informativa }}</div></details>
    <button type="submit" class="btn block">{{ t.contact_submit }}</button>
  </form>
</section>
