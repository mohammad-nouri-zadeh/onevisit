[project]
name = "onevisit-knowledge"
version = "0.1.0"
description = "Fonti ufficiali, catalogo delle procedure, caricamento e validazione (A1, A2, C4)."
requires-python = ">=3.13"
license = "EUPL-1.2"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onevisit_knowledge"]
