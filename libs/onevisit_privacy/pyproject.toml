[project]
name = "onevisit-privacy"
version = "0.1.0"
description = "Rimozione dei dati personali, pseudonimizzazione, scadenze (C9)."
requires-python = ">=3.13"
license = "EUPL-1.2"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.9",
    "cryptography>=43",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onevisit_privacy"]
