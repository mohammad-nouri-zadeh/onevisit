# Configurazione Alembic. URL del database: variabile ONEVISIT_DATABASE_URL.
[alembic]
script_location = %(here)s/src/onevisit_db/migrations
file_template = %%(rev)s_%%(slug)s
timezone = Europe/Rome

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %%(levelname)-5.5s [%%(name)s] %%(message)s
