[project]
name = "onevisit-db"
version = "0.1.0"
description = "Modelli SQLAlchemy, migrazioni Alembic, ruoli del database (C2)."
requires-python = ">=3.13"
license = "EUPL-1.2"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onevisit_db"]
