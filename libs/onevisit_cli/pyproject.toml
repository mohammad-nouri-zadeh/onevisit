[project]
name = "onevisit-cli"
version = "0.1.0"
description = "Comandi Typer: ingest, catalog-check, seed-demo, eval."
requires-python = ">=3.13"
license = "EUPL-1.2"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "markdownify>=0.13",
    "onevisit-knowledge",
    "onevisit-db",
    "onevisit-agent",
]

[project.scripts]
onevisit = "onevisit_cli.main:app"

[tool.uv.sources]
onevisit-knowledge = { workspace = true }
onevisit-db = { workspace = true }
onevisit-agent = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onevisit_cli"]
