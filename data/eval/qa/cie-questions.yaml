# Question bank for the ID card (carta d'identità elettronica, CIE) in Milan.
#
# Realistic questions people ask, in their own words and languages, with the
# saved official pages (data/pages/<source>.md) that answer them. Every
# evidence quote is copied word for word from the page; check_bank.py proves
# it (python data/eval/qa/check_bank.py). See README.md in this folder.
#
# Fields
#   id               stable id, cie-<facet>-<nn>
#   lang             it en es fr ar zh uk bn
#   style            formal | colloquial | typo
#   facet            topic (README lists them)
#   answerable       true: a saved page answers it. false: none does (or out_of_scope)
#   holdout          true: kept out of tuning; see the HOLDOUT banner below
#   question         what the person types
#   answer           what a correct reply must convey (English, for a human or LLM grader)
#   expected_sources source ids that contain the answer; a retrieval hit on any is correct
#   evidence         one quote per expected source at least: {source, quote}
#   redirect         unanswerable only: the official page to send the person to
#   related_sources  unanswerable only: pages with partial, not sufficient, information
#   why              unanswerable only: what is missing
#
# Values are JSON scalars so the file also loads without PyYAML (check_bank.load_bank).
version: 1
questions:

# ======================================================================
# TUNING SET: answerable questions you may read and tune against
# ======================================================================
