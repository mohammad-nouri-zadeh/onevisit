id: cie-aire-it
quick: false
messages:
  - "Sono italiano, vivo a Londra e sono iscritto all'AIRE di Milano. La mia carta d'identità è scaduta e la rinnovo quando torno a Milano: come prenoto e dove me la mandano?"
expect:
